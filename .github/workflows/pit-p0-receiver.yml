name: Prediction Pit P0 receiving session trust-boundary
on:
  pull_request:
    paths:
      - 'scripts/pit-p0/pit-handoff-receiver*'
      - 'scripts/pit-p0/sso-handoff-contract.mjs'
      - '.github/workflows/pit-p0-receiver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-pit-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate live-shaped browser POST to verified-existing-Auth-user session exchange
        run: node --test scripts/pit-p0/pit-handoff-receiver.test.mjs
